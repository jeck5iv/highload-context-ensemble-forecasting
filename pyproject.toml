[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metroflow"
version = "0.1.0"
description = "Short-history multi-station metro passenger-flow forecasting experiments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ivan Kalinin"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "duckdb>=0.10",
    "pyarrow>=14",
]

[project.optional-dependencies]
full = [
    "torch>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "jupyter>=1.0",
    "pytest>=8.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "nbformat>=5.9",
]

[project.scripts]
metroflow-run-metro-study = "metroflow.cli.run_metro_study:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
